<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
<h1>Simon Says Game</h1>
<h2>Press the button to start the game</h2>

<button id="startBtn">Start Game</button>
<!-- Three dot menu -->
<button id="menuBtn">⋮</button>

<!-- How to Play -->
<div class="how-to-play" id="howToPlay">
    <h3>🎮 How to Play</h3>

    <div class="rule">
        <span>1</span>
        <p>Click <b>Start Game</b> to begin.</p>
    </div>

    <div class="rule">
        <span>2</span>
        <p>Watch which button flashes 👀</p>
    </div>

    <div class="rule">
        <span>3</span>
        <p>Click the same button 🎯</p>
    </div>

    <div class="rule">
        <span>4</span>
        <p>Remember the sequence 🧠</p>
    </div>

    <div class="rule">
        <span>5</span>
        <p>Repeat the sequence correctly!</p>
    </div>

    <div class="rule game-over-rule">
        <span>⚡</span>
        <p>Wrong button = <b>GAME OVER!</b></p>
    </div>
</div>
    <div class="btn-container">
        <div class="line-one"> 
            <div class="btn red" type=" button" id="red">1</div>
            <div class="btn yellow " type="button" id="yellow">2</div>
        </div>
        <div class="line-two">
            <div class="btn green" id="green">3</div>
            <div class="btn purple" id="purple">4</div>
        </div>
    </div>
    <script src="simon.js"></script>
</body>
</html>
